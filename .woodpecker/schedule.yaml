# SPDX-PackageName: rpi-kernel-build
# SPDX-PackageSupplier: Ryan Finnie <ryan@finnie.org>
# SPDX-PackageDownloadLocation: https://forge.colobox.com/rfinnie/rpi-kernel-build
# SPDX-FileComment: Woodpecker CI workflow
# SPDX-FileCopyrightText: © 2026 Ryan Finnie <ryan@finnie.org>
# SPDX-License-Identifier: MPL-2.0
---
when:
  - event: "manual"
  - event: "cron"
    cron: "weekly"
labels:
  platform: "linux/amd64"
clone:
  git:
    image: "docker.io/woodpeckerci/plugin-git:latest@sha256:ebde4a4d07e0e24b630082484d192890dd4f6d442d90bf5466f0763860f83652"  # 2026-05-28
steps:
  - name: "Weekly build"
    image: "docker.io/library/debian:trixie@sha256:4ae67669760b807c19f23902a3fd7c121a6a70cf2ae709035674b23e712e4d62"  # 2026-05-19
    commands: |
      set -x

      mkdir -p /etc/apt/apt.conf.d
      cat <<"EOM" >/etc/apt/apt.conf.d/99proxy
      Acquire::http::Proxy "http://deb-proxy.snowman.lan:8000";
      Acquire::https::Proxy "http://deb-proxy.snowman.lan:8000";
      EOM

      apt update
      apt -y install git build-essential bc flex bison libssl-dev perl rsync kmod curl \
        gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
        gcc-arm-linux-gnueabi libc6-dev-armel-cross

      git clone --depth=1 --no-tags --branch=rpi-6.18.y https://github.com/raspberrypi/linux linux

      do_build() {
        git_branch="$1"
        arch="$2"
        platform="$3"
        echo
        echo "=== Build: $${git_branch}, $${arch}, $${platform} ==="
        echo
        env JOBS=8 GIT_FETCH=0 ARCH="$${arch}" GIT_BRANCH="$${git_branch}" PLATFORM="$${platform}" CROSS_COMPILE=yes ./rpi-kernel-build
      }

      ret=0
      do_build rpi-6.18.y arm bcm2709 || ret=$?
      do_build rpi-6.18.y arm bcm2835 || ret=$?
      do_build rpi-6.18.y arm bcmrpi || ret=$?
      do_build rpi-6.18.y arm64 bcm2711 || ret=$?
      do_build rpi-6.18.y arm64 bcm2712 || ret=$?

      for fn in images/*.tar.xz; do
          artifact_fn="$(basename "$${fn}")"
          curl --fail-with-body -T "$${fn}" -H "Authorization: Basic $${ASSETS_AUTH}" "http://artifacts.snowman.lan/$${artifact_fn}"
      done
      exit $ret
    environment:
      ASSETS_AUTH:
        from_secret: "ASSETS_AUTH"
  - name: "Notify Mastodon if failure"
    when:
      - status: ["failure"]
    image: "docker.io/woodpeckerci/plugin-mastodon-post:latest@sha256:456597681cff794b6ddb7b085ce95c42a18301e512503898c4abdaa1080e7e4c"  # 2026-04-19
    settings:
      server_url: "https://m29.us"
      access_token:
        from_secret: "m29_token"
      status: |
        🪿 🪿 🪿 FAILURE: {{ CI_REPO }} 🪿 🪿 🪿
        Workflow: {{ CI_WORKFLOW_NAME }} ({{ CI_PIPELINE_EVENT }} on {{ CI_COMMIT_REF }})

        Pipeline: {{ CI_PIPELINE_URL }}
        Commit: {{ CI_PIPELINE_FORGE_URL }}
